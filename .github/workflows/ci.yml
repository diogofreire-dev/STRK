name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Não precisamos do google-services.json nem do GoogleService-Info.plist:
      # o analyze e os testes só usam o código Dart (lib/firebase_options.dart).
      # Esses ficheiros só fazem falta para compilar a app Android/iOS.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test --no-pub
