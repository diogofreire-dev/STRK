name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Não precisamos do google-services.json nem do GoogleService-Info.plist:
      # o analyze e os testes só usam o código Dart (lib/firebase_options.dart).
      # Esses ficheiros só fazem falta para compilar a app Android/iOS.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # O firebase_options.dart é gerado pelo FlutterFire CLI e fica de fora.
      - name: Verificar formatação
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart' | grep -v firebase_options.dart)
      - run: flutter analyze --fatal-infos
      - run: flutter test --no-pub

  rules:
    # Testa firestore.rules e storage.rules contra os emuladores do Firebase,
    # com um projeto "demo-" que nunca toca no projeto real.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rules_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm install -g firebase-tools
      - run: npm run emulators
